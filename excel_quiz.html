<div class="container" id="quizApp" style="display:none">
  <div class="left">
    <div class="timer" id="timer">Time: 30:00</div>
    <div class="qbox">
      <div class="qnum" id="qnum"></div>
      <div id="question"></div>
      <div id="options"></div>
    </div>
    <button class="nav-btn" onclick="prevQ()">Back</button>
    <button class="nav-btn" onclick="nextQ()">Next</button>
    <button class="mark-btn" onclick="markLater()">Mark for Later</button>
    <button class="submit-btn" onclick="submitQuiz()">Submit</button>
  </div>
  <div class="right">
    <h3>Question Status</h3>
    <div class="grid" id="qGrid"></div>
  </div>
</div>

<div class="container" id="result" style="display:none">
  <div class="left">
    <h2>Result</h2>
    <p id="score"></p>
    <div id="review"></div>
  </div>
</div>

<script>
let selectedQuestions = [];
let current = 0;
let answers = {};
let marked = {};
let time = 30*60;
let timerInt;

function startQuiz(){
  // random 25 question
  selectedQuestions = QUESTION_BANK.sort(()=>0.5-Math.random()).slice(0,25);
  document.getElementById('quizApp').style.display='flex';
  buildGrid();
  showQ();
  startTimer();
}

function startTimer(){
  timerInt = setInterval(()=>{
    time--;
    let m = Math.floor(time/60);
    let s = time%60;
    document.getElementById('timer').innerText = `Time: ${m}:${s.toString().padStart(2,'0')}`;
    if(time<=0){submitQuiz();}
  },1000);
}

function showQ(){
  let q = selectedQuestions[current];
  document.getElementById('qnum').innerText = `Question ${current+1} / 25`;
  document.getElementById('question').innerText = q.q;
  let optHtml='';
  q.o.forEach((op,i)=>{
    optHtml += `<div class="option"><label><input type="radio" name="opt" ${answers[current]==i?'checked':''} onclick="selectAns(${i})"> ${op}</label></div>`;
  });
  document.getElementById('options').innerHTML = optHtml;
  updateGrid();
}

function selectAns(i){ answers[current]=i; updateGrid(); }
function nextQ(){ if(current<24){current++; showQ();} }
function prevQ(){ if(current>0){current--; showQ();} }
function markLater(){ marked[current]=true; updateGrid(); }

function buildGrid(){
  let g='';
  for(let i=0;i<25;i++){
    g+=`<button onclick="jumpQ(${i})" id="g${i}">${i+1}</button>`;
  }
  document.getElementById('qGrid').innerHTML=g;
}
function jumpQ(i){ current=i; showQ(); }

function updateGrid(){
  for(let i=0;i<25;i++){
    let b=document.getElementById('g'+i);
    b.className='';
    if(i===current) b.classList.add('active');
    if(answers[i]!=null) b.classList.add('answered');
    if(marked[i]) b.classList.add('marked');
  }
}

function submitQuiz(){
  clearInterval(timerInt);
  document.getElementById('quizApp').style.display='none';
  document.getElementById('result').style.display='flex';
  let score=0;
  let rev='';
  selectedQuestions.forEach((q,i)=>{
    let correct = q.a;
    let user = answers[i];
    if(user===correct) score++;
    rev += `<p><b>Q${i+1}:</b> ${q.q}<br>`;
    rev += `<span class="${user===correct?'correct':'wrong'}">Your Answer: ${user!=null?q.o[user]:'Not Answered'}</span><br>`;
    rev += `<span class="correct">Correct Answer: ${q.o[correct]}</span></p>`;
  });
  document.getElementById('score').innerText = `Score: ${score} / 25`;
  document.getElementById('review').innerHTML = rev;
}

// auto start
startQuiz();
</script>
