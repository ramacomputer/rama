<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Show Student Data</title>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(120deg, #b1aeae, #ffffff);
        color: #fff;
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    *{
        color: #000;
    }
    h1 {
        text-align: center;
        margin-bottom: 20px;
    }
    .topbar {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 900px;
        align-items: center;
        margin-bottom: 15px;
    }
    .topbar input {
        padding: 8px;
        border: none;
        border-radius: 5px;
        width: 250px;
        background: rgba(255,255,255,0.9);
        color: #000;
    }
    table {
        width: 100%;
        max-width: 900px;
        border-collapse: collapse;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    th, td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    th {
        background: rgba(0,0,0,0.3);
    }
    button {
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        color: white;
        font-weight: 600;
        margin: 2px;
    }
    .view { background: #00C853; }
    .edit { background: #FFC107; color:#000; }
    .delete { background: #E53935; }
    .back {
        background: #2196F3;
        margin-top: 15px;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
    }
    .back:hover {
        transform: scale(1.05);
    }
    @media (max-width: 768px) {
        table { font-size: 12px; }
        .topbar { flex-direction: column; gap: 10px; }
    }
</style>
</head>
<body>

<h1>🎓 All Registered Students</h1>

<div class="topbar">
    <input type="text" id="search" placeholder="Search by Name or Reg No...">
    <button class="back" onclick="window.location.href='index.html'">➕ Add New</button>
</div>

<table id="dataTable">
    <thead>
        <tr>
            <th>Srl</th>
            <th>Reg No</th>
            <th>Name</th>
            <th>Course</th>
            <th>Contact</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
function loadData(){
    const data = JSON.parse(localStorage.getItem("students")) || [];
    const tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML = "";
    data.forEach((student, index)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${student.srl}</td>
            <td>${student.regno}</td>
            <td>${student.name}</td>
            <td>${student.course}</td>
            <td>${student.contact}</td>
            <td>
                <button class="view" onclick="viewStudent(${index})">View</button>
                <button class="edit" onclick="editStudent(${index})">Edit</button>
                <button class="delete" onclick="deleteStudent(${index})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function viewStudent(index){
    const data = JSON.parse(localStorage.getItem("students")) || [];
    localStorage.setItem("previewData", JSON.stringify(data[index]));
    window.location.href = "previewform.html";
}

function editStudent(index){
    const data = JSON.parse(localStorage.getItem("students")) || [];
    localStorage.setItem("editStudent", JSON.stringify({ index: index, data: data[index] }));
    window.location.href = "adminlogin.html";
}

function deleteStudent(index){
    if(confirm("Are you sure you want to delete this record?")){
        const data = JSON.parse(localStorage.getItem("students")) || [];
        data.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(data));
        alert("Record Deleted Successfully!");
        loadData();
    }
}

document.getElementById("search").addEventListener("input", function(){
    const search = this.value.toLowerCase();
    const rows = document.querySelectorAll("#dataTable tbody tr");
    rows.forEach(row=>{
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(search) ? "" : "none";
    });
});

window.onload = loadData;
</script>

</body>
</html>
